name: Deploy pre-prod to GitHub Pages

# Staging: every merge into pre-prod is published at https://leebrown71309.github.io/red-cups/
# to be tried before opening the pull request into main.
on:
  push:
    branches: [pre-prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-site.yml
    with:
      base-path: /red-cups/
    secrets: inherit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # GitHub Pages has no fallback like Nginx's try_files: any unknown path opens the game.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
